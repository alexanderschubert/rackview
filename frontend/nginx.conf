upstream rackview_backend {
    server backend:80;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- API an das Backend weiterreichen ---------------------
    # Das Frontend ruft alles relativ unter /api auf
    # (API_BASE = '/api' in src/App.vue).
    location /api/ {
        proxy_pass http://rackview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # --- Hochgeladene Geraetebilder --------------------------
    # Liegen im Volume des Backend-Containers und werden von
    # dessen Nginx ueber public/storage ausgeliefert.
    location /storage/ {
        proxy_pass http://rackview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public";
    }

    # Health-Endpoint von Laravel durchreichen
    location = /up {
        proxy_pass http://rackview_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Statische Assets -------------------------------------
    # Vite versieht Dateien in /assets mit einem Hash im Namen,
    # sie koennen daher unbegrenzt gecacht werden.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SPA-Fallback -----------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nie cachen, sonst bleibt nach einem Deploy
    # die alte Asset-Referenz im Browser stehen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
