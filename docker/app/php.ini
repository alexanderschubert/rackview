; RackView – PHP-Einstellungen fuer den Produktionsbetrieb
expose_php = Off
memory_limit = 256M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 32M

; Fehler in die Container-Logs, nicht in die HTTP-Antwort
display_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache – deutlich schnellere Antwortzeiten. Der Code aendert sich
; im Image nicht, daher keine Pruefung der Dateizeitstempel noetig.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
