# RackView – Prozesse im Container
#
# PostgreSQL und Cron werden nicht immer gebraucht. Der Entrypoint
# legt fuer sie bei Bedarf eine Datei in /etc/supervisor/conf.d ab.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[include]
files = /etc/supervisor/conf.d/*.conf

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
