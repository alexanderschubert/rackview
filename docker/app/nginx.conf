# =============================================================
# RackView – ein Nginx fuer Oberflaeche und API
# =============================================================
# /srv/www        gebaute Vue-Oberflaeche (statische Dateien)
# /api/, /up      gehen an PHP-FPM (Laravel)
# /storage/       hochgeladene Geraetebilder aus /config/uploads
#
# Hinweis zu add_header: ein add_header in einem Block loescht
# die geerbten Header des Elternblocks. Die Sicherheitsheader
# stehen deshalb in jedem Block, der eigene Header setzt.
# =============================================================

server {
    listen 80 default_server;
    server_name _;

    root /srv/www;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- API --------------------------------------------------
    location /api/ {
        include /etc/nginx/rackview-php.inc;
    }

    # --- Health-Endpunkt von Laravel --------------------------
    location = /up {
        access_log off;
        include /etc/nginx/rackview-php.inc;
    }

    # --- Hochgeladene Geraetebilder ---------------------------
    # Liegen im Datenpfad und werden direkt ausgeliefert, ohne
    # den Umweg ueber PHP.
    location /storage/ {
        alias /config/uploads/;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public" always;

        expires 7d;
        access_log off;
    }

    # --- Statische Dateien der Oberflaeche --------------------
    # Vite haengt einen Hash an die Dateinamen in /assets, sie
    # koennen daher unbegrenzt zwischengespeichert werden.
    location /assets/ {
        try_files $uri =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable" always;

        expires 1y;
        access_log off;
    }

    # --- Einstiegsseite nie zwischenspeichern -----------------
    # Sonst zeigt der Browser nach einem Update noch die alten
    # Dateinamen an, die es im neuen Image nicht mehr gibt.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --- Alles Uebrige an die Oberflaeche ---------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Versteckte Dateien blockieren
    location ~ /\. {
        deny all;
    }
}
