server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # Echte Client-IP kommt vom vorgelagerten Proxy (Nginx Proxy Manager).
    # Laravel wertet die X-Forwarded-* Header via trustProxies aus.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Kein direkter Aufruf anderer PHP-Dateien
    location ~ \.php$ {
        return 404;
    }

    # Versteckte Dateien (ausser ACME-Challenge) blockieren
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
